<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的课表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef0f5 0%, #f4f4f6 240px);
    padding: 22px 8px 44px;
    color: #2e2e36;
  }
  .wrap { max-width: 840px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 6px; }
  .header h1 { font-size: 23px; font-weight: 800; letter-spacing: 1px; }
  .header .sub { font-size: 12.5px; color: #9a9aa6; margin-top: 5px; }

  .savebar { display: flex; justify-content: center; gap: 9px; margin: 14px 0 6px; }
  .btn-keep {
    border: none; padding: 9px 26px; border-radius: 0;
    font-size: 13.5px; cursor: pointer; font-family: inherit; font-weight: 700;
    background: #5b7cf0; color: #fff;
    box-shadow: 0 4px 12px rgba(91,124,240,.35);
    transition: all .15s;
  }
  .btn-keep.saved { background: #35b88a; box-shadow: 0 4px 12px rgba(53,184,138,.35); }
  .btn-keep:active { transform: scale(.96); }
  .btn-refresh {
    border: 1.5px solid #d4d4dc; padding: 9px 18px; border-radius: 0;
    font-size: 13.5px; cursor: pointer; font-family: inherit; font-weight: 700;
    background: #fff; color: #666;
  }
  .btn-refresh:active { transform: scale(.96); }
  .sync-status {
    text-align: center; font-size: 11.5px; margin-bottom: 12px;
    color: #9a9aa6;
  }
  .sync-status.ok { color: #35b88a; }
  .sync-status.err { color: #e8584e; }
  .sync-status.loading { color: #5b7cf0; }

  .card {
    background: #fff; border-radius: 0; padding: 0;
    box-shadow: 0 6px 22px rgba(40,40,70,.07);
    overflow: hidden;
  }

  table {
    width: 100%; border-collapse: collapse;
    table-layout: fixed;
  }
  th, td { text-align: center; vertical-align: middle; }

  /* 单元格分隔线 */
  tbody td { border: 1px solid #ededf2; }
  tbody tr td:first-child { border-left: none; }
  tbody tr td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }

  thead th { padding: 7px 1px; border-bottom: 2px solid #ededf2; }
  thead th .day { font-weight: 700; font-size: 15px; color: #44444f; }
  thead th .date { font-size: 9.5px; color: #b8b8c2; margin-top: 2px; }
  thead th.today { background: #eef1fe; }
  thead th.today .day { color: #4566e0; }
  thead th.today .date { color: #5b7cf0; font-weight: 700; }
  thead .corner .label { font-size: 10px; color: #b8b8c2; font-weight: 700; }
  thead .corner { width: 82px; }

  /* 时段竖标签 */
  .seg-col { width: 22px; padding: 0; }
  .seg {
    width: 22px; height: 100%; color: #fff;
    font-size: 12px; font-weight: 800; line-height: 1.3;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .seg span { display: block; }
  .seg-am { background: linear-gradient(160deg,#ffb74a,#f3992a); }
  .seg-pm { background: linear-gradient(160deg,#6aa9e0,#4f8fd0); }
  .seg-ev { background: linear-gradient(160deg,#9a8fe0,#7d6fd0); }

  /* 时间格 */
  .time-col { width: 60px; padding: 0; }
  .time-card {
    background: #f5f5f9; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .time-card.today { background: #eaeefe; }
  .time-card .num {
    font-size: 15px; font-weight: 800; color: #3a3a44;
    letter-spacing: -.5px; white-space: nowrap;
  }
  .time-card .clock {
    font-size: 9px; color: #fff; background: #b9bac6;
    padding: 1.5px 6px; margin-top: 5px;
    font-weight: 600; white-space: nowrap;
  }
  .time-card.today .num { color: #4566e0; }
  .time-card.today .clock { background: #8aa0f0; }

  tbody td { height: 86px; padding: 0; }
  td.col-today .cell.empty { background: #f3f5fe; }

  .cell {
    width: 100%; height: 100%; cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 5px 2px; transition: transform .1s;
  }
  .cell.empty { background: #fff; }
  .cell.empty:active { background: #eef0f8; }
  .cell.filled { color: #fff; font-weight: 700; }
  .cell.filled:active { transform: scale(.94); }
  .cell .name { font-size: 17px; line-height: 1.2; }
  .cell .note {
    font-size: 10.5px; opacity: .95; margin-top: 4px; font-weight: 500;
    background: rgba(255,255,255,.22); padding: 1.5px 6px;
  }

  .legend {
    display: flex; flex-wrap: wrap; gap: 9px 15px;
    justify-content: center; margin-top: 16px; font-size: 12.5px;
  }
  .legend .item {
    display: flex; align-items: center; gap: 6px;
    background: #fff; padding: 5px 11px; border-radius: 0;
    box-shadow: 0 2px 7px rgba(40,40,70,.06);
  }
  .legend .dot { width: 12px; height: 12px; border-radius: 0; }
  .legend .cnt { color: #b0b0bc; font-size: 11px; }

  .footer { text-align: center; margin-top: 20px; }
  .footer span {
    font-size: 12px; color: #b5b5bd; cursor: pointer;
    border-bottom: 1px dotted #cfcfd6; padding-bottom: 1px;
  }

  .tip {
    max-width: 560px; margin: 14px auto 0; font-size: 11.5px;
    color: #9a9aa6; line-height: 1.7; background: #fff;
    border-radius: 0; padding: 12px 16px;
    box-shadow: 0 4px 14px rgba(40,40,70,.05);
  }
  .tip b { color: #5b7cf0; }

  /* 弹窗 */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(20,20,35,.5);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100; backdrop-filter: blur(2px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: #fff; border-radius: 0; width: 100%; max-width: 344px;
    padding: 22px 20px; box-shadow: 0 16px 50px rgba(0,0,0,.28);
  }
  .modal h3 { font-size: 17px; margin-bottom: 16px; text-align: center; font-weight: 700; }
  .modal label { font-size: 12.5px; color: #9a9aa6; display: block; margin-bottom: 5px; font-weight: 600; }
  .modal input {
    width: 100%; padding: 10px 12px; border: 1.5px solid #e6e6ec;
    border-radius: 0; font-size: 15px; font-family: inherit; margin-bottom: 14px;
    background: #fafafc;
  }
  .modal input:focus { outline: none; border-color: #5b7cf0; background: #fff; }
  .swatches { display: flex; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
  .swatch {
    width: 33px; height: 33px; border-radius: 0; cursor: pointer;
    border: 3px solid transparent; transition: transform .1s;
  }
  .swatch.sel { border-color: #2e2e36; transform: scale(1.08); }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 11px; border-radius: 0; border: none;
    font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 700;
  }
  .btn-save { background: #5b7cf0; color: #fff; }
  .btn-del { background: #fff; color: #e8584e; border: 1.5px solid #f2d3d1; }
  .btn-cancel { background: #f0f0f3; color: #777; }

  .toast {
    position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%);
    background: rgba(20,20,30,.86); color: #fff; font-size: 12.5px;
    padding: 10px 18px; border-radius: 0; z-index: 200;
    opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 86%; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>我的课表</h1>
    <div class="sub">点击格子编辑 · 长按课程可快速删除</div>
  </div>

  <div class="savebar">
    <button class="btn-keep" id="keepBtn">保存课表</button>
    <button class="btn-refresh" id="refreshBtn">刷新</button>
  </div>
  <div class="sync-status" id="syncStatus">正在连接云端…</div>

  <div class="card">
    <table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div class="legend" id="legend"></div>

  <div class="tip">
    这张课表已开启<b>云同步</b>:你或朋友改完课表后,点 <b>保存课表</b>
    就会同步到云端;其他人打开网页或点 <b>刷新</b>,就能看到最新版本。
  </div>

  <div class="footer"><span id="resetLink">恢复默认课表</span></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">编辑课程</h3>
    <label>课程名称</label>
    <input type="text" id="inName" placeholder="如:数学">
    <label>备注(可留空)</label>
    <input type="text" id="inNote" placeholder="如:10:30–12:30">
    <label>颜色</label>
    <div class="swatches" id="swatches"></div>
    <div class="modal-btns">
      <button class="btn-del" id="btnDel">删除</button>
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-save" id="btnSave">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['一','二','三','四','五','六','日'];
const ROWS = [
  {num:'8–10',  clock:'1·2节',   seg:'am'},
  {num:'10–12', clock:'3·4节',   seg:'am'},
  {num:'1–3',   clock:'5·6节',   seg:'pm'},
  {num:'3–5',   clock:'7·8节',   seg:'pm'},
  {num:'5–7',   clock:'9·10节',  seg:'ev'},
  {num:'7–9',   clock:'11·12节', seg:'ev'}
];
const SEGS = {
  am:{name:'上午', cls:'seg-am'},
  pm:{name:'下午', cls:'seg-pm'},
  ev:{name:'晚上', cls:'seg-ev'}
};
const COLORS = ['#e8584e','#f0b13c','#6b8ef0','#a05cd6','#3fb98a','#4ec3d6','#9aa0ad'];

function defaultSchedule(){
  const s = Array.from({length:6}, ()=>Array(7).fill(null));
  const set = (r,c,name,note,color)=>{ s[r][c] = {name,note:note||'',color}; };
  set(0,1,'数学','','#e8584e');
  set(0,2,'历史','','#6b8ef0');
  set(0,4,'数学','','#e8584e');
  set(0,5,'英语','','#f0b13c');
  set(0,6,'英语','','#f0b13c');
  set(1,1,'英语','','#f0b13c');
  set(1,2,'数学','10:30–12:30','#e8584e');
  set(1,6,'历史','10:30–12:30','#6b8ef0');
  set(2,2,'历史','学校','#6b8ef0');
  set(2,3,'英语','1–4','#f0b13c');
  set(2,4,'历史','','#6b8ef0');
  set(2,5,'政治','','#a05cd6');
  set(3,4,'政治','','#a05cd6');
  set(3,6,'政治','','#a05cd6');
  set(4,2,'地理','','#3fb98a');
  set(4,4,'地理','','#3fb98a');
  set(5,0,'地理','6–8','#3fb98a');
  set(5,4,'地理','6–8','#3fb98a');
  return s;
}

// ===== Supabase 云同步配置 =====
const SB_URL = 'https://bcqctqeokcbyhmydsfom.supabase.co';
const SB_KEY = 'sb_publishable_-KMPJ5aqyPdsByAv3xOfeA_3q28Q2NG';
const SB_TABLE = SB_URL + '/rest/v1/schedule';
const SB_HEAD = {
  'apikey': SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Content-Type': 'application/json'
};

let schedule = null;
// 先用本地缓存快速显示(避免白屏)
try {
  const ls = localStorage.getItem('myschedule');
  if(ls) schedule = JSON.parse(ls);
} catch(e){ schedule = null; }
if(!schedule) schedule = defaultSchedule();

function localSave(){
  try { localStorage.setItem('myschedule', JSON.stringify(schedule)); } catch(e){}
}

// 同步状态显示
function setSyncStatus(text, type){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'sync-status' + (type ? ' ' + type : '');
}

// 从云端拉取最新课表
function cloudLoad(){
  fetch(SB_TABLE + '?id=eq.1&select=data', { headers: SB_HEAD })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(rows => {
      if(rows && rows.length && rows[0].data && Array.isArray(rows[0].data)
         && rows[0].data.length === 6){
        schedule = rows[0].data;
        localSave();
        render();
        setSyncStatus('云端已同步', 'ok');
      } else {
        // 云端还没数据,把当前本地课表上传一次作为初始
        cloudSave(true);
      }
    })
    .catch(err => {
      setSyncStatus('云端连接失败,当前为本地课表', 'err');
    });
}

// 保存课表到云端
function cloudSave(silent){
  setSyncStatus('保存中…', 'loading');
  fetch(SB_TABLE + '?id=eq.1', {
    method: 'PATCH',
    headers: Object.assign({}, SB_HEAD, {'Prefer': 'return=minimal'}),
    body: JSON.stringify({ data: schedule, updated_at: new Date().toISOString() })
  })
    .then(r => {
      if(r.ok){
        setSyncStatus('已保存到云端 ✓', 'ok');
        const b = document.getElementById('keepBtn');
        if(b){ b.classList.add('saved'); b.textContent = '已保存 ✓'; }
        if(!silent) showToast('已保存到云端,其他设备刷新即可看到');
      } else {
        return Promise.reject(r.status);
      }
    })
    .catch(err => {
      setSyncStatus('保存失败,请检查网络后重试', 'err');
      if(!silent) showToast('保存失败,请检查网络后重试');
    });
}

// 今天周几 -> 列号
const jsDay = new Date().getDay();
const todayCol = jsDay === 0 ? 6 : jsDay - 1;
// 本周日期(周一为起点)
function weekDates(){
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - todayCol);
  return Array.from({length:7}, (_,i)=>{
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return (d.getMonth()+1) + '/' + d.getDate();
  });
}
const DATES = weekDates();

function render(){
  const head = document.getElementById('headRow');
  head.innerHTML = '<th class="corner" colspan="2"><span class="label">时段/节次</span></th>';
  DAYS.forEach((d,i)=>{
    const th = document.createElement('th');
    if(i===todayCol) th.className = 'today';
    th.innerHTML = '<span class="day">'+d+'</span>' +
      '<div class="date">'+DATES[i]+'</div>';
    head.appendChild(th);
  });
  const body = document.getElementById('body');
  body.innerHTML = '';
  ROWS.forEach((rowInfo,r)=>{
    const tr = document.createElement('tr');
    if(r % 2 === 0){
      const segTd = document.createElement('td');
      segTd.className = 'seg-col';
      segTd.rowSpan = 2;
      const seg = SEGS[rowInfo.seg];
      const chars = seg.name.split('').map(ch=>'<span>'+ch+'</span>').join('');
      segTd.innerHTML = '<div class="seg '+seg.cls+'">'+chars+'</div>';
      tr.appendChild(segTd);
    }
    const tc = document.createElement('td');
    tc.className = 'time-col';
    tc.innerHTML = '<div class="time-card">'+
      '<span class="num">'+rowInfo.num+'</span>'+
      '<span class="clock">'+rowInfo.clock+'</span></div>';
    tr.appendChild(tc);
    for(let c=0;c<7;c++){
      const td = document.createElement('td');
      if(c===todayCol) td.className = 'col-today';
      const item = schedule[r][c];
      const cell = document.createElement('div');
      if(item){
        cell.className = 'cell filled';
        cell.style.background = item.color;
        cell.innerHTML = '<span class="name">'+item.name+'</span>' +
          (item.note ? '<span class="note">'+item.note+'</span>' : '');
      } else {
        cell.className = 'cell empty';
      }
      cell.onclick = ()=> openModal(r,c);
      // 长按快速删除
      if(item){
        let pressTimer = null;
        const startPress = ()=>{
          pressTimer = setTimeout(()=>{
            pressTimer = null;
            if(confirm('删除「'+item.name+'」?')){
              schedule[r][c] = null;
              localSave(); render(); markUnsaved();
            }
          }, 550);
        };
        const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
        cell.addEventListener('touchstart', startPress, {passive:true});
        cell.addEventListener('touchend', cancelPress);
        cell.addEventListener('touchmove', cancelPress, {passive:true});
        cell.addEventListener('mousedown', startPress);
        cell.addEventListener('mouseup', cancelPress);
        cell.addEventListener('mouseleave', cancelPress);
        // 长按触发后不再触发 click
        cell.addEventListener('click', e=>{
          if(pressTimer===null && cell._suppressClick){ e.stopImmediatePropagation(); }
        }, true);
      }
      td.appendChild(cell);
      tr.appendChild(td);
    }
    body.appendChild(tr);
  });
  renderLegend();
}

function renderLegend(){
  const map = {};
  schedule.flat().forEach(it=>{
    if(it){
      if(!map[it.name]) map[it.name] = {color:it.color, cnt:0};
      map[it.name].cnt++;
    }
  });
  const lg = document.getElementById('legend');
  lg.innerHTML = '';
  Object.entries(map).forEach(([n,info])=>{
    const d = document.createElement('div');
    d.className = 'item';
    d.innerHTML = '<span class="dot" style="background:'+info.color+'"></span>'+
      n+'<span class="cnt">×'+info.cnt+'</span>';
    lg.appendChild(d);
  });
}

let editR=0, editC=0, pickedColor=COLORS[0];
const modalBg = document.getElementById('modalBg');

function openModal(r,c){
  editR=r; editC=c;
  const item = schedule[r][c];
  document.getElementById('modalTitle').textContent = '周'+DAYS[c]+' · '+ROWS[r].num;
  document.getElementById('inName').value = item ? item.name : '';
  document.getElementById('inNote').value = item ? item.note : '';
  pickedColor = item ? item.color : COLORS[0];
  buildSwatches();
  document.getElementById('btnDel').style.display = item ? '' : 'none';
  modalBg.classList.add('show');
  setTimeout(()=>document.getElementById('inName').focus(),100);
}

function buildSwatches(){
  const sw = document.getElementById('swatches');
  sw.innerHTML = '';
  COLORS.forEach(c=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (c===pickedColor?' sel':'');
    s.style.background = c;
    s.onclick = ()=>{ pickedColor = c; buildSwatches(); };
    sw.appendChild(s);
  });
}

function closeModal(){ modalBg.classList.remove('show'); }

function markUnsaved(){
  const b = document.getElementById('keepBtn');
  b.classList.remove('saved');
  b.textContent = '保存课表';
}

function doEdit(){
  const name = document.getElementById('inName').value.trim();
  if(!name){ schedule[editR][editC] = null; }
  else {
    schedule[editR][editC] = {
      name,
      note: document.getElementById('inNote').value.trim(),
      color: pickedColor
    };
  }
  localSave(); render(); closeModal(); markUnsaved();
}
document.getElementById('btnSave').onclick = doEdit;
['inName','inNote'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown', e=>{
    if(e.key==='Enter') doEdit();
  });
});
document.getElementById('btnDel').onclick = ()=>{
  schedule[editR][editC] = null;
  localSave(); render(); closeModal(); markUnsaved();
};
document.getElementById('btnCancel').onclick = closeModal;
modalBg.onclick = (e)=>{ if(e.target===modalBg) closeModal(); };

document.getElementById('resetLink').onclick = ()=>{
  if(confirm('确定恢复成默认课表?当前修改会丢失。')){
    schedule = defaultSchedule(); localSave(); render(); markUnsaved();
  }
};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
document.getElementById('keepBtn').onclick = ()=>{
  localSave();
  cloudSave(false);
};

document.getElementById('refreshBtn').onclick = ()=>{
  setSyncStatus('正在刷新…', 'loading');
  cloudLoad();
};

render();
cloudLoad();
</script>
</body>
</html>
